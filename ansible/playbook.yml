---
# ---------------------------------------------------------------------------
# Kubo en un servidor propio (Fase 5).
#
# Deja el sistema corriendo en una maquina limpia con secretos UNICOS: las
# claves del despliegue se generan en el host (no viajan en el repositorio) y
# los certificados de la malla se crean alli mismo.
#
# Uso:
#   ansible-playbook -i inventory.ini playbook.yml
#
# Requisitos: un host con Debian/Ubuntu y acceso SSH con sudo.
# ---------------------------------------------------------------------------
- name: Kubo en un servidor propio
  hosts: kubo
  become: true

  vars:
    kubo_dir: /opt/kubo
    kubo_repo: "{{ lookup('env', 'KUBO_REPO') | default('https://gitlab.com/kubo/kubo.git', true) }}"
    kubo_version: "{{ lookup('env', 'KUBO_VERSION') | default('main', true) }}"
    # Puertos publicos: SOLO el borde TLS de Caddy (3080 redirige a 3443). La
    # PWA se sirve a traves de el, de modo que todo el trafico del negocio va
    # cifrado y la cookie de refresco viaja con Secure. Los servicios internos,
    # las bases y el puerto directo de la PWA NO se publican.
    kubo_public_ports: ["3080", "3443"]
    # Claves del despliegue: cada familia se genera con la longitud que el
    # servicio exige (32 bytes para AES-256-GCM, 64+ para las semillas de
    # Phoenix/Rails). No van en el repositorio: se crean en el host.
    kubo_secret_keys: >-
      KUBO_POSTGRES_ROOT_PASSWORD KUBO_IAM_DB_PASSWORD KUBO_CRM_DB_PASSWORD
      KUBO_ERP_DB_PASSWORD KUBO_RABBITMQ_PASSWORD
    kubo_secret_keys_32: >-
      KUBO_FIELD_ENCRYPTION_KEY KUBO_BLIND_INDEX_KEY KUBO_TOTP_ENCRYPTION_KEY
    kubo_secret_keys_64: >-
      KUBO_ERP_SECRET_KEY_BASE KUBO_CRM_SECRET_KEY_BASE

  tasks:
    - name: Paquetes base
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - openssl
          - ufw
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Docker y el plugin de compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Servicio de Docker habilitado (los servicios vuelven tras un reinicio)
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Codigo del proyecto
      ansible.builtin.git:
        repo: "{{ kubo_repo }}"
        dest: "{{ kubo_dir }}"
        version: "{{ kubo_version }}"
        depth: 1

    - name: Secretos del despliegue (se generan una sola vez, en el host)
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          cp .env.example .env
          for clave in {{ kubo_secret_keys }}; do
            sed -i "s|^${clave}=.*|${clave}=$(openssl rand -hex 24)|" .env
          done
          # Claves de cifrado de 32 bytes (64 hexadecimales): el CRM y el TOTP
          # rechazan longitudes menores y los valores de ejemplo.
          for clave in {{ kubo_secret_keys_32 }}; do
            sed -i "s|^${clave}=.*|${clave}=$(openssl rand -hex 32)|" .env
          done
          # Semillas de firma (Phoenix y Rails exigen 64+ caracteres).
          for clave in {{ kubo_secret_keys_64 }}; do
            sed -i "s|^${clave}=.*|${clave}=$(openssl rand -hex 64)|" .env
          done
          # Llave RSA de firma JWT en una sola linea (PKCS#8 en base64; el IAM
          # la normaliza igual que un PEM). Sin ella, los tokens no sobreviven
          # un reinicio ni funcionan con varias replicas.
          JWT_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \
            | openssl pkey -outform DER 2>/dev/null | base64 -w0)
          sed -i "s|^KUBO_JWT_PRIVATE_KEY=.*|KUBO_JWT_PRIVATE_KEY=${JWT_KEY}|" .env
          sed -i "s|^KUBO_ADMIN_PASSWORD=.*|KUBO_ADMIN_PASSWORD=$(openssl rand -base64 12)|" .env
          # Todo el acceso va por HTTPS (solo Caddy es publico): la cookie de
          # refresco sale con Secure.
          sed -i "s|^KUBO_COOKIE_SECURE=.*|KUBO_COOKIE_SECURE=true|" .env
          sed -i "s|^KUBO_PLATFORM_ADMIN_PASSWORD=.*|KUBO_PLATFORM_ADMIN_PASSWORD=$(openssl rand -base64 12)|" .env
          # Webhook del proveedor de pagos (F6.6): 64 hexadecimales para HMAC-SHA256.
          sed -i "s|^KUBO_PAYMENTS_WEBHOOK_SECRET=.*|KUBO_PAYMENTS_WEBHOOK_SECRET=$(openssl rand -hex 32)|" .env
          chmod 600 .env
        chdir: "{{ kubo_dir }}/kubo-infra"
        creates: "{{ kubo_dir }}/kubo-infra/.env"

    - name: Certificados de la malla interna (P-28)
      ansible.builtin.command:
        cmd: ./kubo-infra/scripts/gen-internal-certs.sh
        chdir: "{{ kubo_dir }}"
        creates: "{{ kubo_dir }}/kubo-infra/certs/ca.crt"

    - name: Levantar el sistema
      ansible.builtin.command:
        cmd: make up
        chdir: "{{ kubo_dir }}"

    # Se usa `ufw` por comandos para no depender de la coleccion
    # community.general: el despliegue solo necesita ansible-core.
    - name: "Cortafuegos: abrir solo lo publico"
      ansible.builtin.command:
        cmd: "ufw allow {{ item }}/tcp"
      loop: "{{ kubo_public_ports }}"
      changed_when: false

    - name: "Cortafuegos: politica por defecto (niega lo demas)"
      ansible.builtin.command:
        cmd: ufw --force default deny incoming
      changed_when: false

    - name: "Cortafuegos: encendido"
      ansible.builtin.command:
        cmd: ufw --force enable
      changed_when: false

    - name: Recordatorio de la contrasena inicial
      ansible.builtin.debug:
        msg: >-
          El usuario es admin@kubo.local y la contrasena quedo en
          {{ kubo_dir }}/kubo-infra/.env (KUBO_ADMIN_PASSWORD). Cambiela al
          entrar y active el segundo factor.
