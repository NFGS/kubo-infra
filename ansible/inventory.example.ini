; Inventario de ejemplo (Fase 5): copiar a inventory.ini y ajustar.
;
; Un servidor propio (VPS, PC del local o mini-PC) con Debian/Ubuntu y acceso
; SSH con sudo. Kubo es autoalojable: no hace falta nada mas.

[kubo]
kubo-app ansible_host=192.168.1.50 ansible_user=deploy

; Opcional: variables del despliegue
; [kubo:vars]
; ansible_port=22
; ansible_ssh_private_key_file=~/.ssh/kubo_deploy
