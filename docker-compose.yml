name: kubo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-postgres-env: &postgres-env
  KUBO_IAM_DB_PASSWORD: ${KUBO_IAM_DB_PASSWORD:-kubo_iam_dev}
  KUBO_CRM_DB_PASSWORD: ${KUBO_CRM_DB_PASSWORD:-kubo_crm_dev}
  KUBO_ERP_DB_PASSWORD: ${KUBO_ERP_DB_PASSWORD:-kubo_erp_dev}

services:
  # ---------------------------------------------------------------------------
  # Infraestructura de datos
  # ---------------------------------------------------------------------------
  # Las imagenes base se fijan por digest (P-14): una etiqueta como
  # `postgres:17-alpine` puede cambiar de contenido sin avisar. Para actualizar:
  #   docker pull <imagen> && docker inspect --format '{{index .RepoDigests 0}}' <imagen>
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: kubo-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: kubo_root
      POSTGRES_PASSWORD: ${KUBO_POSTGRES_ROOT_PASSWORD:-kubo_root_dev}
      POSTGRES_DB: postgres
      <<: *postgres-env
    ports:
      - "127.0.0.1:${KUBO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubo_root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    networks: [kubo-net]

  mongo:
    image: mongo:8.2@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    container_name: kubo-mongo
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${KUBO_MONGO_PORT:-27018}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 384m
    networks: [kubo-net]

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:ce634665a8e7262384a793581c20cb8a46343887446eb391b77c814febeca4b2
    container_name: kubo-rabbitmq
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${KUBO_RABBITMQ_USER:-kubo}
      RABBITMQ_DEFAULT_PASS: ${KUBO_RABBITMQ_PASSWORD:-kubo_rabbit_dev}
    ports:
      - "127.0.0.1:${KUBO_RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${KUBO_RABBITMQ_UI_PORT:-15673}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 384m
    networks: [kubo-net]

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: kubo-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${KUBO_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 160m
    networks: [kubo-net]

  # ---------------------------------------------------------------------------
  # Microservicios
  # ---------------------------------------------------------------------------
  kubo-iam:
    build:
      context: ../kubo-iam
      dockerfile: Dockerfile
    container_name: kubo-iam
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kubo_iam
      SPRING_DATASOURCE_USERNAME: kubo_iam
      SPRING_DATASOURCE_PASSWORD: ${KUBO_IAM_DB_PASSWORD:-kubo_iam_dev}
      KUBO_SEED_ENABLED: ${KUBO_SEED_ENABLED:-false}
      KUBO_ADMIN_EMAIL: ${KUBO_ADMIN_EMAIL:-admin@kubo.local}
      KUBO_ADMIN_PASSWORD: ${KUBO_ADMIN_PASSWORD:?KUBO_ADMIN_PASSWORD es obligatoria (ver .env.example)}
      KUBO_TENANT_NAME: ${KUBO_TENANT_NAME:-Tienda La Esquina}
      KUBO_TIMEZONE: ${KUBO_TIMEZONE:-America/Bogota}
      # Llave RSA para firmar los JWT. Si se deja vacia, IAM genera una efimera y
      # TODAS las sesiones se invalidan al reiniciar el servicio.
      KUBO_JWT_PRIVATE_KEY: ${KUBO_JWT_PRIVATE_KEY:-}
      # Llave con la que se cifra el secreto TOTP en reposo (P-30).
      KUBO_TOTP_ENCRYPTION_KEY: ${KUBO_TOTP_ENCRYPTION_KEY:-}
      # Operador de plataforma (F6.4): se crea al arrancar si no existe.
      KUBO_PLATFORM_ADMIN_EMAIL: ${KUBO_PLATFORM_ADMIN_EMAIL:-operador@kubo.local}
      KUBO_PLATFORM_ADMIN_PASSWORD: ${KUBO_PLATFORM_ADMIN_PASSWORD:?KUBO_PLATFORM_ADMIN_PASSWORD es obligatoria (ver .env.example)}
      # Webhook del proveedor de pagos (F6.6): firma HMAC del cuerpo.
      KUBO_PAYMENTS_WEBHOOK_SECRET: ${KUBO_PAYMENTS_WEBHOOK_SECRET:-}
      KUBO_INTERNAL_TLS: "true"
      KUBO_TLS_CERT: /certs/iam.crt
      KUBO_TLS_KEY: /certs/iam.key
      KUBO_TLS_CA: /certs/ca.crt
      # Bloqueo de cuenta por intentos fallidos (P-11).
      KUBO_AUTH_MAX_FAILED_ATTEMPTS: ${KUBO_AUTH_MAX_FAILED_ATTEMPTS:-5}
      KUBO_AUTH_LOCK_MINUTES: ${KUBO_AUTH_LOCK_MINUTES:-15}
      KUBO_AUTH_RESET_TOKEN_MINUTES: ${KUBO_AUTH_RESET_TOKEN_MINUTES:-30}
      # Correo: `log` (buzon de demostracion) o `smtp` (servidor real, P-04).
      KUBO_MAIL_TRANSPORT: ${KUBO_MAIL_TRANSPORT:-log}
      KUBO_MAIL_FROM: ${KUBO_MAIL_FROM:-no-responder@kubo.local}
      KUBO_RESET_URL_BASE: ${KUBO_RESET_URL_BASE:-http://localhost:3000/recuperar}
      KUBO_SMTP_HOST: ${KUBO_SMTP_HOST:-}
      KUBO_SMTP_PORT: ${KUBO_SMTP_PORT:-587}
      KUBO_SMTP_USERNAME: ${KUBO_SMTP_USERNAME:-}
      KUBO_SMTP_PASSWORD: ${KUBO_SMTP_PASSWORD:-}
      KUBO_SMTP_STARTTLS: ${KUBO_SMTP_STARTTLS:-true}
      # Trazas OTLP hacia el collector (P-07).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://kubo-otel:4318
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
    ports:
      - "127.0.0.1:${KUBO_IAM_PORT:-9081}:8081"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/certs/ca.crt --certificate=/certs/iam.crt --private-key=/certs/iam.key https://localhost:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 640m
    networks: [kubo-net]

  kubo-crm:
    build:
      context: ../kubo-crm
      dockerfile: Dockerfile
    container_name: kubo-crm
    restart: unless-stopped
    logging: *default-logging
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://kubo_crm:${KUBO_CRM_DB_PASSWORD:-kubo_crm_dev}@postgres:5432/kubo_crm
      KUBO_FIELD_ENCRYPTION_KEY: ${KUBO_FIELD_ENCRYPTION_KEY}
      KUBO_BLIND_INDEX_KEY: ${KUBO_BLIND_INDEX_KEY}
      SECRET_KEY_BASE: ${KUBO_CRM_SECRET_KEY_BASE:?KUBO_CRM_SECRET_KEY_BASE es obligatoria (ver .env.example)}
      KUBO_RUN_MIGRATIONS: "true"
      PORT: "8082"
      KUBO_INTERNAL_TLS: "true"
      KUBO_TLS_CERT: /certs/crm.crt
      KUBO_TLS_KEY: /certs/crm.key
      KUBO_TLS_CA: /certs/ca.crt
      OTEL_EXPORTER_OTLP_ENDPOINT: http://kubo-otel:4318
    ports:
      - "127.0.0.1:${KUBO_CRM_PORT:-9082}:8082"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/certs/ca.crt --certificate=/certs/crm.crt --private-key=/certs/crm.key https://localhost:8082/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 512m
    networks: [kubo-net]

  kubo-erp:
    build:
      context: ../kubo-erp
      dockerfile: Dockerfile
    container_name: kubo-erp
    restart: unless-stopped
    logging: *default-logging
    environment:
      MIX_ENV: prod
      DATABASE_URL: ecto://kubo_erp:${KUBO_ERP_DB_PASSWORD:-kubo_erp_dev}@postgres:5432/kubo_erp
      AMQP_URL: amqp://${KUBO_RABBITMQ_USER:-kubo}:${KUBO_RABBITMQ_PASSWORD:-kubo_rabbit_dev}@rabbitmq:5672
      SECRET_KEY_BASE: ${KUBO_ERP_SECRET_KEY_BASE:?KUBO_ERP_SECRET_KEY_BASE es obligatoria (ver .env.example)}
      KUBO_TIMEZONE: ${KUBO_TIMEZONE:-America/Bogota}
      PORT: "8083"
      KUBO_RUN_MIGRATIONS: "true"
      PHX_SERVER: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://kubo-otel:4318
      # Documentos (P-25): volumen propio, entra en el respaldo.
      KUBO_DOCUMENTS_PATH: /data/documents
      # Malla interna (P-28, ADR-0020): HTTPS con certificado de cliente.
      KUBO_INTERNAL_TLS: "true"
      KUBO_TLS_CERT: /certs/erp.crt
      KUBO_TLS_KEY: /certs/erp.key
      KUBO_TLS_CA: /certs/ca.crt
    ports:
      - "127.0.0.1:${KUBO_ERP_PORT:-9083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # La malla exige cliente: el healthcheck presenta el certificado del propio
      # servicio (cualquier certificado de la CA sirve como cliente).
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/certs/ca.crt --certificate=/certs/erp.crt --private-key=/certs/erp.key https://localhost:8083/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    volumes:
      - documents:/data/documents
      - ./certs:/certs:ro
    mem_limit: 512m
    networks: [kubo-net]

  # Operador de respaldos (ADR-0022): perfil `backup`. En bucle diario con
  # `--profile backup up -d kubo-backup`; `make backup-operator` corre un ciclo
  # suelto con verificacion de restauracion.
  kubo-backup:
    build:
      context: ./backup
    container_name: kubo-backup
    restart: unless-stopped
    logging: *default-logging
    profiles: ["backup"]
    # Con el usuario del host: los respaldos quedan en el volumen del dueno y no
    # de root (el ciclo no necesita privilegios).
    user: "${KUBO_BACKUP_UID:-1000}:${KUBO_BACKUP_GID:-1000}"
    environment:
      KUBO_POSTGRES_ROOT_PASSWORD: ${KUBO_POSTGRES_ROOT_PASSWORD:-kubo_root_dev}
      KUBO_BACKUP_RETENTION_DAYS: ${KUBO_BACKUP_RETENTION_DAYS:-14}
      KUBO_BACKUP_INTERVAL_HOURS: ${KUBO_BACKUP_INTERVAL_HOURS:-24}
      KUBO_BACKUP_OFFSITE_DIR: /offsite
      KUBO_ENV_FILE: /config/.env
    volumes:
      - ./backups:/backups
      - ./.env:/config/.env:ro
      - documents:/documents:ro
      - ${KUBO_BACKUP_OFFSITE_DIR:-./backups-offsite}:/offsite
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    mem_limit: 256m
    networks: [kubo-net]

  kubo-analytics:
    build:
      context: ../kubo-analytics
      dockerfile: Dockerfile
    container_name: kubo-analytics
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: kubo_analytics
      KUBO_TIMEZONE: ${KUBO_TIMEZONE:-America/Bogota}
      AMQP_URL: amqp://${KUBO_RABBITMQ_USER:-kubo}:${KUBO_RABBITMQ_PASSWORD:-kubo_rabbit_dev}@rabbitmq:5672/
      PORT: "8084"
      KUBO_INTERNAL_TLS: "true"
      KUBO_TLS_CERT: /certs/analytics.crt
      KUBO_TLS_KEY: /certs/analytics.key
      KUBO_TLS_CA: /certs/ca.crt
      OTEL_EXPORTER_OTLP_ENDPOINT: http://kubo-otel:4318
    ports:
      - "127.0.0.1:${KUBO_ANALYTICS_PORT:-9084}:8084"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/certs/ca.crt --certificate=/certs/analytics.crt --private-key=/certs/analytics.key https://localhost:8084/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 448m
    networks: [kubo-net]

  # ---------------------------------------------------------------------------
  # Puerta de entrada (API Gateway)
  # ---------------------------------------------------------------------------
  kubo-gateway:
    build:
      context: ../kubo-gateway
      dockerfile: Dockerfile
    container_name: kubo-gateway
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      KUBO_IAM_URL: https://kubo-iam:8081
      KUBO_CRM_URL: https://kubo-crm:8082
      KUBO_ERP_URL: https://kubo-erp:8083
      KUBO_INTERNAL_TLS: "true"
      KUBO_TLS_CERT: /certs/gateway.crt
      KUBO_TLS_KEY: /certs/gateway.key
      KUBO_TLS_CA: /certs/ca.crt
      KUBO_ANALYTICS_URL: https://kubo-analytics:8084
      KUBO_JWKS_URI: https://kubo-iam:8081/api/v1/auth/.well-known/jwks.json
      KUBO_RATE_LIMIT_PER_MINUTE: "600"
      # Configurable para que la prueba de humo pueda elevarlo durante su corrida
      # (hace ~20 peticiones de autenticacion y debe poder repetirse sin fallar).
      KUBO_AUTH_RATE_LIMIT_PER_MINUTE: ${KUBO_AUTH_RATE_LIMIT_PER_MINUTE:-40}
      # Limite por usuario (P-31): una cuenta comprometida no consume la cuota del negocio.
      # Configurable para que `make load` lo eleve solo durante la prueba de carga.
      KUBO_USER_RATE_LIMIT_PER_MINUTE: ${KUBO_USER_RATE_LIMIT_PER_MINUTE:-300}
      # Dias de vigencia de la cookie httpOnly del refresh token (P-03).
      KUBO_REFRESH_COOKIE_DAYS: "7"
      # Trazas OTLP hacia el collector (P-07).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://kubo-otel:4318
    ports:
      - "127.0.0.1:${KUBO_GATEWAY_PORT:-9080}:8080"
    depends_on:
      kubo-iam:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - ./certs:/certs:ro
    mem_limit: 384m
    networks: [kubo-net]

  # ---------------------------------------------------------------------------
  # Observabilidad: collector OTLP (P-07). El stack visual (Tempo, Loki,
  # Grafana) vive bajo el perfil `observability`.
  # ---------------------------------------------------------------------------
  kubo-otel:
    image: otel/opentelemetry-collector-contrib:latest@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    container_name: kubo-otel
    restart: unless-stopped
    logging: *default-logging
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "127.0.0.1:${KUBO_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${KUBO_OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${KUBO_OTEL_HEALTH_PORT:-13133}:13133"
    healthcheck:
      # La imagen es distroless (sin shell ni cliente HTTP): la sonda interna
      # consulta el endpoint de salud desde el host o con curl a 13133.
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 192m
    networks: [kubo-net]

  # ---------------------------------------------------------------------------
  # TLS: Caddy termina HTTPS en el local y redirige HTTP (P-27)
  # ---------------------------------------------------------------------------
  kubo-tls:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: kubo-tls
    restart: unless-stopped
    logging: *default-logging
    environment:
      KUBO_TLS_DOMAIN: ${KUBO_TLS_DOMAIN:-localhost}
    ports:
      # La PWA y el borde TLS son la cara publica del negocio: se publican en
      # todas las interfaces. El resto de puertos solo escucha en loopback.
      - "${KUBO_TLS_HTTP_PORT:-3080}:80"
      - "${KUBO_TLS_HTTPS_PORT:-3443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      kubo-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 96m
    networks: [kubo-net]

  # ---------------------------------------------------------------------------
  # PWA (nginx sirve el front y proxea /api al gateway: mismo origen, sin CORS)
  # ---------------------------------------------------------------------------
  kubo-web:
    build:
      context: ../kubo-web
      dockerfile: Dockerfile
    container_name: kubo-web
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Unica superficie que ve el negocio: la PWA.
      - "${KUBO_WEB_PORT:-3000}:80"
    depends_on:
      kubo-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    networks: [kubo-net]

volumes:
  documents:
  pgdata:
  mongodata:
  rabbitdata:
  caddydata:
  caddyconfig:

networks:
  kubo-net:
    driver: bridge
